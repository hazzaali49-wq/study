<script id="atlasLectureData" type="application/json">{"title":"Calcium (and Phosphorus) Homeostasis","slide_count":34,"slides":[{"n":1,"title":"Calcium (and phosphorus) homeostasis","source":"Title slide. Electron micrograph shows a multinucleated osteoclast.","explain":"Homeostasis means keeping the internal environment within a narrow range. This lecture is about keeping free ionised calcium (Ca²⁺) and phosphate (PO₄³⁻) safe while still allowing bone to act as a large mineral store.","priority":"high","origin":"source","key_points":[]},{"n":2,"title":"What the lecture covers","source":"Endocrine regulation of plasma calcium and phosphate; parathyroid glands and PTH; hypocalcaemia/tetany; CaSR; vitamin D; calcitonin; parathyroid disorders.","explain":"Use this as the map: low calcium is sensed by the parathyroid, PTH acts on bone and kidney, vitamin D adds intestinal absorption, and calcitonin provides a smaller opposing signal.","priority":"high","origin":"source","key_points":[]},{"n":3,"title":"Why calcium and phosphate matter","source":"Bone calcium-phosphate salts provide skeletal strength. Phosphate is used in signalling, DNA/RNA, phospholipids, ATP/creatine phosphate and complex carbohydrates. Calcium supports neuromuscular excitability, coagulation, hormone secretion, enzymes and cell signalling.","explain":"These ions are not just 'bone minerals'. Calcium is an electrical/signalling ion; phosphate is an energy and structural ion. That is why plasma levels are tightly controlled.","priority":"medium","origin":"source","key_points":[]},{"n":4,"title":"Hypocalcaemia vs hypercalcaemia","source":"Hypocalcaemia increases membrane Na⁺ permeability and makes nerves/muscles overexcitable → tetany. Hypercalcaemia reduces neuromuscular sensitivity and can cause constipation, fatigue, bone pain, renal stones and arrhythmias. Trousseau sign shown.","explain":"Low Ca²⁺ lowers the threshold for firing, so muscles spasm. High Ca²⁺ stabilises excitable membranes, but excess calcium also affects gut, kidney, bone and heart.","priority":"high","origin":"source","key_points":[]},{"n":5,"title":"Where calcium is stored","source":"~99% of total body Ca²⁺ is in skeleton. ~1% of skeletal calcium is rapidly exchangeable. Extraskeletal calcium is mostly intracellular; only ~0.1% is extracellular. Plasma total calcium ~9–10 mg/dL (~2.5 mM); about half is free/ionised and biologically active.","explain":"The exam-relevant number is the free ionised fraction: it is the biologically active calcium sensed by CaSR and kept very stable.","priority":"medium","origin":"source","key_points":[]},{"n":6,"title":"Where phosphate is stored","source":"Total body phosphorus ~0.6 kg: ~80% skeleton, ~15% soft tissues, ~5% plasma. Plasma phosphate ~2.5–4.0 mg/dL; most is diffusible, some protein-bound, and some incorporated in molecules such as ATP/cAMP.","explain":"Phosphate is also buffered between bone, cells and plasma. PTH intentionally pushes phosphate down while it pushes calcium up.","priority":"medium","origin":"source","key_points":[]},{"n":7,"title":"Calcium × phosphate and bone remodelling","source":"Ca²⁺ and PO₄³⁻ are inversely related; the lecture states their product is kept limited to avoid spontaneous precipitation. Bone remodelling is introduced.","explain":"If both ions rise together, calcium-phosphate can precipitate in soft tissue. One reason PTH increases phosphate excretion is to raise Ca²⁺ without letting the Ca×PO₄ product rise too much.","priority":"high","origin":"source","key_points":[]},{"n":8,"title":"Osteoblasts, osteoclasts, osteocytes","source":"Osteoblasts form bone and secrete matrix. Osteoclasts are large multinucleated monocyte-lineage cells that resorb bone. Osteocytes are mature bone cells embedded in matrix and maintain bone.","explain":"Think: blast = build; clast = crush; cyte = resident cell. PTH effects on bone ultimately alter calcium/phosphate movement through these cell systems.","priority":"high","origin":"source","key_points":[]},{"n":9,"title":"Osteoblast micrograph","source":"Colour scanning electron micrograph of an osteoblast in bone.","explain":"Recognise the bone-forming cell. Osteoblasts sit on bone surfaces and lay down osteoid, the unmineralised organic matrix that later mineralises.","priority":"low","origin":"source","key_points":[]},{"n":10,"title":"Osteoclast micrograph","source":"Colour scanning electron micrograph of an osteoclast.","explain":"Osteoclasts are multinucleated resorbing cells. Their ruffled border increases surface area for acid/enzyme secretion against bone.","priority":"medium","origin":"source","key_points":[]},{"n":11,"title":"Three main calcium-regulating hormones","source":"PTH, 1,25-dihydroxy vitamin D₃ (calcitriol) and calcitonin regulate calcium/phosphate resorption, reabsorption, absorption and excretion through bone, kidney and intestine.","explain":"PTH is the dominant rapid endocrine regulator of ionised Ca²⁺. Calcitriol supports intestinal uptake. Calcitonin has a smaller role in normal adult calcium homeostasis.","priority":"high","origin":"source","key_points":[]},{"n":12,"title":"Parathyroid hormone basics","source":"PTH is a conserved peptide hormone. PTH receptor type 1 is important in kidney and bone; type 2 occurs in CNS/pancreas/testis/placenta. PTHrP can mimic PTH and is secreted by some tumours, causing hypercalcaemia of malignancy.","explain":"PTH is a peptide, so it acts through cell-surface receptors. PTHrP = parathyroid-hormone-related peptide; tumour secretion can produce a PTH-like biochemical picture.","priority":"medium","origin":"source","key_points":[]},{"n":13,"title":"Parathyroid histology overview","source":"Histology image distinguishes thyroid tissue (T) from parathyroid tissue (Pth); surrounding connective tissue/capsule is indicated.","explain":"Parathyroid tissue is much more densely cellular than thyroid follicles. In a spotter, first distinguish follicle-filled thyroid from solid parathyroid cell cords.","priority":"high","origin":"source","key_points":[]},{"n":14,"title":"Chief and oxyphil cells","source":"Chief/principal cells: small, dark round nuclei, lightly eosinophilic cytoplasm; secrete PTH and express CaSR. Oxyphil cells: larger, abundant eosinophilic cytoplasm, often clustered; no major endocrine role given in the lecture.","explain":"Chief cells are the key functional cells for this exam: they sense extracellular Ca²⁺ using the calcium-sensing receptor (CaSR) and adjust PTH secretion.","priority":"high","origin":"source","key_points":[]},{"n":15,"title":"PTH secretion follows calcium inversely","source":"PTH is the dominant regulator of plasma free Ca²⁺. PTH secretion rises as Ca²⁺ falls and is suppressed as Ca²⁺ rises. The slide gives maximal secretion below ~3.5 mg/dL and maximal inhibition above ~5.5 mg/dL.","explain":"Core rule: low Ca²⁺ → high PTH; high Ca²⁺ → low PTH. This inverse relationship is the quickest way to reason through parathyroid cases.","priority":"high","origin":"source","key_points":[]},{"n":16,"title":"Osteocytic osteolysis vs osteoclastic resorption","source":"Osteocytic osteolysis: rapid, local, reversible release of Ca²⁺ and PO₄³⁻. Osteoclastic resorption: slower remodelling with loss of mineral and collagen matrix; also releases Ca²⁺ and PO₄³⁻.","explain":"Important correction: the source parenthesis describes osteocytes as 'mature osteoclasts'. That is not correct; osteocytes are mature osteoblast-lineage cells embedded in bone. Keep the process distinction, not that typo.","priority":"high","origin":"source","key_points":[]},{"n":17,"title":"Osteocytic osteolysis image","source":"Diagram: PTH-stimulated perilacunar/canalicular resorption around osteocytes.","explain":"This is the fast-access calcium pool. PTH can mobilise calcium around osteocyte lacunae before slower osteoclast-driven remodelling becomes important.","priority":"medium","origin":"source","key_points":[]},{"n":18,"title":"PTH has opposing calcium/phosphate effects","source":"Diagram emphasises that PTH raises plasma calcium but lowers plasma phosphate.","explain":"This apparent contradiction is deliberate: bone releases both ions, but the kidney reabsorbs more Ca²⁺ while wasting phosphate. Net effect = Ca²⁺ up, PO₄³⁻ down.","priority":"high","origin":"source","key_points":[]},{"n":19,"title":"Calcium-sensing receptor (CaSR)","source":"CaSR is a GPCR on chief cells and other calcium-sensitive cells. Low Ca²⁺ means less receptor activation and more PTH; high Ca²⁺ means more activation and less PTH. Cinacalcet is a calcimimetic. Activating/inactivating CaSR mutations cause characteristic disorders.","explain":"CaSR is the body's 'calcistat'. A calcimimetic such as cinacalcet makes the receptor behave as though calcium is higher, so PTH secretion falls.","priority":"high","origin":"source","key_points":[]},{"n":20,"title":"Overall actions of PTH","source":"PTH prevents/reverses hypocalcaemia. Bone: increases calcium release. Kidney: increases distal calcium reabsorption and decreases phosphate reabsorption. Intestine: indirect effect by stimulating renal calcitriol synthesis.","explain":"Memorise the destination logic: bone releases Ca²⁺; kidney keeps Ca²⁺ but dumps phosphate; kidney also activates vitamin D so intestine absorbs more calcium.","priority":"high","origin":"source","key_points":[]},{"n":21,"title":"Renal calcium handling","source":"Proximal tubule reabsorbs ~65–70% Ca²⁺ mostly passively; thick ascending limb ~20–25% largely paracellular; distal convoluted tubule ~8–10% but tightly regulated by PTH. PTH inhibits NPT2 phosphate transporter, increasing phosphate excretion. TRPV5/calbindin/NCX1/PMCA1b shown.","explain":"The distal convoluted tubule is the small but controllable calcium segment. PTH increases transcellular Ca²⁺ reabsorption there while reducing proximal phosphate reclamation.","priority":"high","origin":"source","key_points":[]},{"n":22,"title":"Vitamin D is a hormone","source":"Sources: skin synthesis and diet. It can be synthesised de novo, so physiologically it behaves as a hormone. It circulates bound to vitamin-D-binding protein and promotes intestinal Ca²⁺ absorption, with additional bone actions.","explain":"Vitamin D's main calcium-homeostasis job here is to increase gut absorption. 'Vitamin' is historical naming; calcitriol is a steroid-like endocrine hormone.","priority":"high","origin":"source","key_points":[]},{"n":23,"title":"Vitamin D activation pathway","source":"7-dehydrocholesterol → vitamin D₃ in skin; liver → 25(OH)D₃ (calcidiol); kidney 1α-hydroxylase → 1,25(OH)₂D₃ (calcitriol). 24-hydroxylation gives an inactive metabolite. PTH and low phosphate stimulate 1α-hydroxylase; calcitriol feeds back negatively.","explain":"A high-yield sequence: skin → liver storage form → kidney active form. PTH controls the kidney step, linking low calcium to stronger intestinal calcium absorption.","priority":"high","origin":"source","key_points":[]},{"n":24,"title":"How calcitriol increases gut calcium absorption","source":"Diagram shows TRPV6 entry, calbindin-D transport, NCX1/PMCA extrusion, nuclear VDR-mediated gene expression, MARRS rapid signalling and paracellular transport (transcaltachia).","explain":"VDR = vitamin D receptor. Calcitriol increases the proteins needed to move calcium across enterocytes from lumen to blood. The slide also shows faster non-genomic/paracellular routes.","priority":"high","origin":"source","key_points":[]},{"n":25,"title":"PTH + vitamin D integrated loop","source":"Summary diagram: low Ca²⁺ sensed by CaSR → PTH. Bone releases calcium. Kidney increases Ca²⁺ reabsorption, phosphate excretion and calcitriol formation. Calcitriol increases intestinal calcium/phosphate absorption. Ca²⁺ rises.","explain":"This is the master diagram of the lecture. If you can redraw this loop from memory, you can answer most physiology questions on calcium homeostasis.","priority":"high","origin":"source","key_points":[]},{"n":26,"title":"Calcitonin","source":"Produced by thyroid C/parafollicular cells. Minor role normally, but can respond to acute hypercalcaemia. It inhibits osteoclast activity, reduces renal Ca²⁺ reabsorption and reduces intestinal calcium absorption; net plasma Ca²⁺ falls. High Ca²⁺ stimulates secretion.","explain":"Calcitonin opposes PTH directionally, but do not give it equal importance in normal adult homeostasis. It is also clinically associated with medullary thyroid carcinoma.","priority":"medium","origin":"source","key_points":[]},{"n":27,"title":"Parathyroid disorders overview","source":"Hyperparathyroidism: primary, secondary and tertiary. Hypoparathyroidism: primary low PTH; pseudohypoparathyroidism has low Ca²⁺ with high PTH because target tissues resist PTH.","explain":"Use calcium + PTH together. Primary gland overactivity gives PTH inappropriately high despite high Ca²⁺. Resistance gives high PTH because the signal cannot produce its effect.","priority":"high","origin":"source","key_points":[]},{"n":28,"title":"Primary hyperparathyroidism","source":"~85% single parathyroid adenoma; ~15% hyperplasia. May be asymptomatic or cause stones/fracture/low bone density. Typical evaluation: high Ca²⁺ and PTH, low/normal phosphate; consider ALP, urinary calcium, renal ultrasound and bone density.","explain":"Classic lab pattern: Ca²⁺ ↑, PTH ↑, phosphate ↓/normal. 'Stones and bones' are useful clinical clues, but many cases are found on routine blood tests.","priority":"high","origin":"source","key_points":[]},{"n":29,"title":"Hypoparathyroidism","source":"Causes include thyroid-surgery trauma, autoimmune disease and DiGeorge syndrome. Symptoms include fatigue, mood change, bronchospasm and tetany. Labs: low/absent PTH, hypocalcaemia and normal/high phosphate.","explain":"Classic primary hypoparathyroidism: Ca²⁺ ↓, PTH ↓, phosphate ↑. After thyroid surgery, always think about accidental parathyroid damage or devascularisation.","priority":"high","origin":"source","key_points":[]},{"n":30,"title":"Tutorial and midterm reminder","source":"Tutorial 2: Thyroid and Parathyroid. Midterm assessment reminder.","explain":"Administrative slide. The content before this point is examinable; use the integrated PTH/Vit-D and disorder slides as revision anchors.","priority":"low","origin":"source","key_points":[]},{"n":31,"title":"Detailed intestinal calcium transport","source":"Diagram shows apical TRPV5/6 calcium entry, calbindin-D intracellular shuttle, basolateral NCX1 and PMCA1b export, paracellular movement and calcitriol-driven protein synthesis. NPT2 phosphate transport is noted.","explain":"Read the cell from lumen → blood. Ca²⁺ enters apically, is buffered/shuttled by calbindin, then exits basolaterally through exchanger/pump systems.","priority":"medium","origin":"source","key_points":[]},{"n":32,"title":"Transition / no readable slide content","source":"No readable professor text was present on this source page.","explain":"Nothing examinable was recoverable from this page; no new factual content is added here.","priority":"low","origin":"source","key_points":[]},{"n":33,"title":"Whole-body PTH response diagram","source":"Low serum Ca²⁺ sensed through CaSR → PTH release. PTH increases bone resorption, renal Ca²⁺ reabsorption, phosphate excretion and renal 25-hydroxyvitamin-D activation to 1,25(OH)₂D; intestine then increases calcium/phosphate absorption.","explain":"This is another integration diagram. Trace every arrow and always finish with the net effect on plasma Ca²⁺ and phosphate.","priority":"high","origin":"source","key_points":[]},{"n":34,"title":"CaSR intracellular signalling","source":"Diagram shows CaSR coupling to inhibitory G-protein signalling that reduces adenylyl cyclase/cAMP and to Gq/PLC signalling producing IP₃/DAG, intracellular Ca²⁺ signals and PKC activation; receptor internalisation machinery is also shown.","explain":"You do not need every protein to grasp the logic: extracellular Ca²⁺ activates a GPCR, which changes second-messenger pathways inside the chief cell and suppresses PTH release.","priority":"medium","origin":"source","key_points":[]}]}</script>
