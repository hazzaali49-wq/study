.memory-task-done .memory-task-detail strong{text-decoration:line-through;opacity:.65}
.memory-pill{background:#344b39!important;color:#e4f2d8!important}
.lecture-detail{min-width:0;display:grid;gap:5px}.lecture-progress{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stage-pill{font-size:10px;color:#adb8be;border:1px solid #465060;background:#29313c;border-radius:25px;padding:2px 8px;white-space:nowrap}
.stage-2,.stage-3{color:#d3e6af;border-color:#677552}.stage-4{color:#bbf0d1;border-color:#68a981;background:#243e32}
.ready-btn{font-size:10px;border:1px solid #455364;background:#212c3b;color:#b1c3cf;border-radius:6px;padding:3px 7px}.ready-btn.is-ready{border-color:#4c8d70;color:#c0efd7}
.lecture-row.completed .lecture-detail>span{text-decoration:none;color:#d6e9da}
.memory-upcoming{display:grid;gap:8px}.memory-upcoming button{border:1px solid #334639;background:#222c2b;color:#e3eee1;border-radius:8px;padding:10px;text-align:left;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:6px}.memory-upcoming button span{font-size:11px;color:#b2c3b0}
@media(max-width:730px){.bottom-nav{grid-template-columns:repeat(6,1fr)}.bottom-nav button{font-size:8px}.memory-banner{align-items:stretch;flex-direction:column}.memory-task-detail strong{font-size:11px}.lecture-progress{gap:5px}}

/* v3 — one-module-at-a-time focus roadmap */
.focus-intro{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#1c2b34;border:1px solid #4c6671;border-radius:14px;padding:18px 22px;margin:4px 0 22px}
.focus-intro strong{font-size:14px;color:#e2f3e8;flex:0 0 175px}
.focus-intro span{color:#bed1d5;font-size:12px;line-height:1.6;flex:1}
.focus-intro .btn{flex:0 0 auto}
.focus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 22px}
.focus-card{text-align:left;display:flex;flex-direction:column;gap:10px;min-height:204px;padding:21px 23px;background:#172130;border:1px solid #344151;border-left:5px solid var(--sc);border-radius:14px;color:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.focus-card:hover{background:#1e2b3a;border-color:#718596;transform:translateY(-1px)}
.focus-card.focus-now{background:#213044;border-color:#97bbbf}
.focus-card-top,.focus-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.focus-eyebrow{font-size:10px;font-weight:780;letter-spacing:1.5px;color:var(--sc)}
.focus-date{font-size:11px;color:#b3c5d0}
.focus-title{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.focus-description{font-size:12px;line-height:1.6;color:#b4c3cc;flex:1}
.focus-bottom{border-top:1px solid #354354;padding-top:12px;font-size:10px;color:#aebeca}
.focus-bottom span:last-child{font-weight:750;color:#dceade}
.focus-today{display:flex;align-items:center;justify-content:space-between;gap:15px;border-radius:15px;border:1px solid #455f66;background:#1e2d39;padding:18px 21px;margin:0 0 23px}
.focus-today h2{margin:7px 0;font-size:21px}
.focus-today p{font-size:12px;color:#b6c6ce;line-height:1.5;max-width:720px;margin:0}
.calendar-focus{margin-top:0}
@media(max-width:880px){.focus-grid{grid-template-columns:1fr}.focus-card{min-height:165px}.focus-intro{align-items:flex-start;flex-direction:column}.focus-intro strong{flex:auto}.focus-today{align-items:flex-start;flex-direction:column}}
@media(max-width:730px){.focus-card{padding:17px 18px}.focus-title{font-size:17px}.focus-description{font-size:11px}.focus-today h2{font-size:18px}}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];

 if(s.date>='2026-10-31'&&s.date<='2026-12-07'){
  const base=isWorkDay(s.date)?60:360;
  const desired=isWorkDay(s.date)?+state.settings.workDayMinutes:(+state.settings.offDayHours)*60;
  return Math.max(0,Math.round((Number(s.minutes)||0)*desired/base/5)*5);
 }

}

 return `${heading('Memorize within the block','Each memory session uses the same module as that day’s learning. No extra switching between five subjects.','FOCUSED ACTIVE RECALL',`<button class="btn btn-primary" data-page="focus">View subject blocks →</button>`)}
 <div class="memory-banner"><div><b>Work days: 20 min recall. Days off: 2h recall.</b><span>Both are included inside your usual 1h work-day or 6h off-day plan. Recall what you learned today and earlier in the current subject block. The 2- and 7-day spacing is flexible because subject switching is intentionally avoided.</span></div></div>
 <div class="stats-grid">${stat('FIRST RECALL',rs.memorized,`Of ${rs.total} tracked topics`)}${stat('TWO REVIEWS',rs.reviewed,'Recall rounds recorded')}${stat('EXAM READY',rs.ready,'Your own confidence check')}${stat('MEMORY DAYS',memorySessions.length,'One subject per study day')}</div>
 <div class="main-grid"><section class="panel"><div class="section-heading"><h2>${current?shortDate(current.date)+' · '+getMod(current.module).short:'Select a memorization day'}</h2><button class="link-btn" data-page="calendar">Calendar →</button></div>${current?memoryCard(current):'<div class="empty">No separate memory session for this day. Use the active-recall and timed-question portions of its revision block.</div>'}</section>
 <div class="stack"><section class="panel"><div class="section-heading"><h2>Memorization timetable</h2></div><div class="memory-upcoming">${next.map(s=>`<button data-action="open-memory-date" data-date="${s.date}"><b>${shortDate(s.date)}</b><span>${esc(getMod(s.module).short)} · ${(s.reviews||[]).length} topics · ${fmtH(sessionMinutes(s))}</span><strong>→</strong></button>`).join('')||'<p class="muted">No further dated memory blocks.</p>'}</div></section><section class="panel"><div class="section-heading"><h2>Four stages</h2></div><p class="help-text"><b>Learned</b> means you understand the lecture.<br><b>Memorizing</b> means you recalled it without slides once.<br><b>Reviewed</b> means you did a second recall.<br><b>Exam ready</b> means you can solve actual exam-style questions.<br><br>Memory checks are scheduled when the same subject returns, not always at an exact +2 or +7 days.</p></section></div></div>`;
}

function renderExams(){return `${heading('Exams & deadlines','The exact December finals from your timetable, plus earlier course checkpoints.','THE FINISH LINE')}
<section class="panel" style="margin-bottom:20px"><div class="section-heading"><h2>Exam dates</h2><small>All times are Dublin local time</small></div>${D.exams.map(e=>{const d=dateObj(e.date),diff=dayDiff(currentToday,e.date);return `<div class="exam-card" style="border-left:3px solid ${colorOf(e.module)}"><div class="exam-big-date"><b>${d.getDate()}</b><span>${shortMonths[d.getMonth()]}</span></div><div><h3>${esc(e.name)}</h3><p>${esc(getMod(e.module).code)} · ${esc(e.time)} · ${esc(weekdays[d.getDay()])}</p></div><div class="countdown">${diff>0?diff+' days away':diff===0?'TODAY':'Completed date'}</div></div>`}).join('')}</section>
<div class="settings-grid"><section class="panel"><div class="section-heading"><h2>Other deadlines</h2></div>${D.deadlines.map(x=>`<div class="deadline" style="--sc:${colorOf(x.module)};margin-bottom:9px"><b>${esc(x.title)}</b><small>${longDate(x.date)}</small></div>`).join('')}</section><section class="panel"><div class="section-heading"><h2>Final-week rules</h2></div><p class="help-text">8–9 Dec: GIT only. After GIT: Locomotor until its exam, then Neuroscience. 15 Dec: revise Neuroscience after the Locomotor exam. 16–17 Dec: protect time for your consecutive exams. 18 Dec: final Endocrine revision. Arrange Saturday work cover on 19 Dec.</p><div class="note-banner"><b>Important:</b> If your individual exam notice or Brightspace changes a date, update the exam entries in <code>data.js</code>.</div></section></div>`}
function renderSettings(){return `${heading('Settings & source files','Change your workload, back up what you finish, and keep the original course references.','MAKE IT YOURS')}
<div class="settings-grid"><div><section class="setting-card"><h3>Study hours</h3><p>Changing these scales the same-subject learning and memorization blocks until 7 December. Individual study blocks can still be edited separately in the calendar.</p><div class="setting-row"><label for="off-hours">Off-work hours / day (Tue–Fri)</label><input class="number-input" id="off-hours" type="number" min="1" max="12" step="0.5" value="${state.settings.offDayHours}"></div><div class="setting-row"><label for="work-mins">Work-day study minutes (Sat–Mon)</label><input class="number-input" id="work-mins" type="number" min="0" max="180" step="15" value="${state.settings.workDayMinutes}"></div><p class="panel-note">Daily focus: Tue–Fri 4h learning + 2h recall; Sat–Mon 40m learning + 20m recall. One subject per day until exams. Exam-week hours are separate and editable.</p></section><section class="setting-card"><h3>Data & backups</h3><p>Your ticks and timetable edits are stored on this device, in this browser. They are not uploaded to any server.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" data-action="export">↓ Export progress JSON</button><button class="btn btn-outline" data-action="import">↑ Import backup</button><button class="btn btn-danger" data-action="reset">Reset saved changes</button></div></section></div>
<div><section class="setting-card"><h3>Editable website source</h3><p>The complete ZIP contains HTML, CSS, JavaScript, <code>data.js</code>, source timetables, and a README. Edit the <code>phases</code> and <code>sessions</code> in data.js to move subject blocks. All design and schedule data can be edited offline.</p><div class="source-file"><span>index.html / styles.css / app.js</span><span class="small-tag">LAYOUT & INTERACTIONS</span></div><div class="source-file"><span>data.js / data.json</span><span class="small-tag">LECTURES & STUDY PLAN</span></div><div class="source-file"><span>README.md / build_data.py</span><span class="small-tag">EDITING INSTRUCTIONS</span></div></section><section class="setting-card"><h3>Uploaded course references</h3><p>These copies are bundled locally in <code>reference/</code>. They're the basis for the lecture titles and assessment dates.</p>${D.modules.map(m=>`<div class="source-file"><span>${esc(m.short)} — ${esc(m.source)}</span><a href="reference/${encodeURIComponent(m.source)}" download>Download ↧</a></div>`).join('')}<div class="source-file"><span>PATH module orientation and assessment details</span><a href="reference/${encodeURIComponent('Module Orientation_2026.pdf')}" download>Download ↧</a></div></section></div></div>`}
function render(){renderSidebar();$('#main').innerHTML=({dashboard:renderDashboard,focus:renderFocus,calendar:renderCalendar,lectures:renderLectures,memorize:renderMemorization,exams:renderExams,settings:renderSettings})[page]();}
function setPage(p){if(!['dashboard','focus','calendar','lectures','memorize','exams','settings'].includes(p))return;page=p;render();window.scrollTo({top:0,behavior:'smooth'});}
function pickDate(date){if(!/^\d{4}-\d\d-\d\d$/.test(date))return;state.selectedDate=date;month=date.slice(0,7);save();render();}
function adjustMonth(change){let [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+change,1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();}
function toggleSession(id){const s=allSessions().find(x=>x.id===id);if(!s)return;const newValue=!doneSession(id);state.doneSessions[id]=newValue;if(newValue&&s.kind==='study')(s.lectureIds||[]).forEach(lid=>state.doneLectures[lid]=true);save();render();toast(newValue?'Study block completed':'Block marked unfinished');}
function toggleLecture(id,checked){state.doneLectures[id]=checked;if(!checked)state.examReady[id]=false;save();render();}
function openSessionModal(id){const s=allSessions().find(x=>x.id===id);modal=id?{type:'edit',id}:{type:'add'};const x=s||{date:state.selectedDate,module:'git',title:'New study session',minutes:60};$('#modal-host').innerHTML=`<div class="modal-overlay" data-action="close-modal-bg"><form class="modal" id="session-form" novalidate><div class="modal-head"><h2>${id?'Edit':'Add'} study block</h2><button type="button" class="modal-close" data-action="close-modal">✕</button></div><div class="field"><label for="session-date">Date</label><input id="session-date" name="date" type="date" required value="${esc(x.date)}"/></div><div class="field"><label for="session-module">Subject</label><select id="session-module" name="module">${D.modules.map(m=>`<option value="${m.id}" ${x.module===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label for="session-title">What you'll study</label><textarea id="session-title" rows="3" name="title" required>${esc(x.title)}</textarea></div><div class="field"><label for="session-duration">Minutes</label><input id="session-duration" name="minutes" type="number" min="10" max="720" required value="${id?sessionMinutes(x):x.minutes}"/></div><div class="modal-actions">${id?`<button class="btn btn-danger" type="button" data-action="delete-session" data-id="${id}">Delete</button>`:'<span></span>'}<div><button type="button" class="btn btn-quiet" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div></div></form></div>`;$('#session-title').focus();}
function closeModal(){modal=null;$('#modal-host').innerHTML='';}
function deleteSession(id){state.deleted[id]=true;save();closeModal();render();toast('Session removed from your plan');}
function exportData(){const data={format:'finals-studio-backup',version:1,exported:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`finals-progress-${dateStr(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),700);toast('Backup downloaded');}
function reset(){if(!confirm('Reset all study progress and calendar edits to the original plan? This cannot be undone without a backup.'))return;state=blankState();save();render();toast('Original plan restored');}
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-page]');if(p){setPage(p.dataset.page);return;}
 const btn=e.target.closest('[data-action]');if(!btn)return;
 const a=btn.dataset.action;
 if(a==='jump-focus'){pickDate(btn.dataset.date);setPage('calendar');}
 else if(a==='filter-module'){filter=btn.dataset.module;search='';onlyPending=false;setPage('lectures');}
 else if(a==='export')exportData();
 else if(a==='import')$('#import-file').click();
 else if(a==='reset')reset();
 else if(a==='today')pickDate(initialDate);
 else if(a==='mark-ready')toggleReady(btn.dataset.id);
 else if(a==='open-memory-date'){pickDate(btn.dataset.date);setPage('memorize');}
 else if(a==='prev-month')adjustMonth(-1);
 else if(a==='next-month')adjustMonth(1);
 else if(a==='choose-date')pickDate(btn.dataset.date);
 else if(a==='shift-date'){const d=dateObj(state.selectedDate);d.setDate(d.getDate()+(+btn.dataset.amount));pickDate(dateStr(d));}
 else if(a==='add-session')openSessionModal();
 else if(a==='edit-session')openSessionModal(btn.dataset.id);
 else if(a==='toggle-session')toggleSession(btn.dataset.id);
 else if(a==='pending-only'){onlyPending=!onlyPending;render();}
 else if(a==='close-modal')closeModal();
 else if(a==='close-modal-bg'&&e.target===btn)closeModal();
 else if(a==='delete-session')deleteSession(btn.dataset.id);
});
document.addEventListener('input',e=>{
 if(e.target.id==='search-lectures'){const pos=e.target.selectionStart;search=e.target.value;render();const el=$('#search-lectures');el.focus();el.setSelectionRange(pos,pos);}
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-lecture]'))toggleLecture(e.target.dataset.lecture,e.target.checked);
 if(e.target.matches('[data-memory]'))toggleReview(e.target.dataset.memory,e.target.checked);
 if(e.target.id==='filter-module'){filter=e.target.value;render();}
 if(e.target.id==='off-hours'){state.settings.offDayHours=Math.min(12,Math.max(1,+e.target.value||6));save();render();toast('Off-work hours updated');}
 if(e.target.id==='work-mins'){state.settings.workDayMinutes=Math.min(180,Math.max(0,+e.target.value||0));save();render();toast('Work-day minutes updated');}
 if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(imported.format!=='finals-studio-backup'||!imported.state||typeof imported.state!=='object')throw new Error('Invalid backup');state={...blankState(),...imported.state,settings:{...D.settings,...imported.state.settings}};save();render();toast('Study progress imported');}catch(err){alert('Could not import this backup: '+err.message);}};reader.readAsText(file);e.target.value='';}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='session-form')return;e.preventDefault();const form=new FormData(e.target),date=String(form.get('date')||''),moduleId=String(form.get('module')||''),title=String(form.get('title')||'').trim(),minutes=Number(form.get('minutes'));
 if(!date||!title||!D.modules.some(m=>m.id===moduleId)||!(minutes>=10&&minutes<=720)){alert('Enter a subject, date, study topic, and between 10 and 720 minutes.');return;}
 if(modal?.type==='edit'){state.overrides[modal.id]={...(state.overrides[modal.id]||{}),date,module:moduleId,title,minutes};}else{state.customSessions.push({id:`custom-${Date.now()}-${Math.floor(Math.random()*10000)}`,date,module:moduleId,title,minutes,kind:'study',lectureIds:[]});}
 state.selectedDate=date;month=date.slice(0,7);save();closeModal();render();toast('Study session saved');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();});
render();
})();

</script>
</body>
</html>
